#.github/workflows/linting.yaml
name: Linting Checks

on:
  pull_request:
    branches:
      - master
      - develop
    paths:
      - '**.py'
  push:
    branches:
      - '**' # Every branch
    paths:
      - '**.py'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  linting:
    env:
      GITHUB_TOKEN: ${{ secrets.GH_REPO_READ_TOKEN }}
    if: github.repository_owner == 'destination-earth-digital-twins'
    name: Run Linters
    runs-on: ubuntu-latest
    environment: staging
    steps:
      #----------------------------------------------
      #       check-out repo and set-up python
      #----------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      #----------------------------------------------
      #  --- configure poetry & install project  ----
      #----------------------------------------------
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true


      - name: Modify pyproject.toml
        run: |
          sed -i 's#git@github.com:destination-earth-digital-twins/#https://github.com/destination-earth-digital-twins/#g' pyproject.toml

      - name: Load cached venv (if cache exists)
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/pyproject.toml') }}

      - name: Set github credentials
        uses: ./.github/actions/setup-github-credentials
        with:
          github_token: ${{ env.GITHUB_TOKEN }}

      - name: Install dependencies (if venv cache is not found)
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: |
          cat pyproject.toml
          poetry install --no-interaction --no-root --only linting

      - name: Install the project itself
        run: |
          cat pyproject.toml 
          poetry install --no-interaction --only-root

      #----------------------------------------------
      #         Run the linting checks
      #----------------------------------------------
      - name: isort
        run: |
          poetry run isort --check-only .
      - name: black
        run: |
          poetry run black --check --diff .
      - name: flakeheaven
        run: |
          export FLAKEHEAVEN_CACHE="${TMPDIR:-${TEMP:-${TMP:-/tmp}}}/flakeheaven_cache.$(openssl rand -hex 12)"
          poetry run flakeheaven lint .
